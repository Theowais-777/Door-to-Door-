version: '3.8'

services:
  door-to-door-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: d2d-kashmir-app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - ../doortodoor.db:/app/doortodoor.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

