syntax = "proto3";

package transit;

service KashmirTransitService {
  rpc GetLocations (LocationQuery) returns (LocationListResponse);
  rpc CalculateRoute (RouteRequest) returns (RouteResponse);
  rpc StreamLivePosition (LiveStreamRequest) returns (stream LivePositionResponse);
  rpc GetNeighborHexagons (NeighborRequest) returns (NeighborResponse);
}

message LocationQuery {
  string filter = 1;
}

message LocationInfo {
  string id = 1;
  string name = 2;
  string category = 3;
  double lat = 4;
  double lng = 5;
  string h3_cell = 6;
  string description = 7;
  string highlights = 8;
  repeated string cell_boundary_json = 9;
}

message LocationListResponse {
  repeated LocationInfo locations = 1;
}

message RouteRequest {
  string origin_id = 1;
  string destination_id = 2;
  string transport_mode = 3; // "two_wheeler", "car", "xl_car", "bus"
}

message TransportOption {
  string mode = 1;
  string mode_label = 2;
  int32 fare_min = 3;
  int32 fare_max = 4;
  int32 duration_minutes = 5;
  double distance_km = 6;
  string icon = 7;
  string recommendation = 8;
  string safety_tip = 9;
}

message RouteResponse {
  string origin_name = 1;
  string destination_name = 2;
  double distance_km = 3;
  string selected_mode = 4;
  repeated TransportOption options = 5;
  repeated string path_points = 6;
  repeated string h3_hexagons = 7;
}

message LiveStreamRequest {
  string origin_id = 1;
  string destination_id = 2;
  string transport_mode = 3;
  int32 interval_ms = 4;
}

message LivePositionResponse {
  int32 step_index = 1;
  int32 total_steps = 2;
  double current_lat = 3;
  double current_lng = 4;
  string current_h3_cell = 5;
  double progress_percentage = 6;
  string status_message = 7;
}

message NeighborRequest {
  string location_id = 1;
  double lat = 2;
  double lng = 3;
  int32 ring_size = 4; // k=1 (6 neighbors) or k=2 (18 neighbors)
}

message HexagonCellInfo {
  string h3_cell = 1;
  double center_lat = 2;
  double center_lng = 3;
  int32 ring_distance = 4;
  bool is_center = 5;
  repeated string boundary_json = 6;
  string zone_name = 7;
}

message NeighborResponse {
  string center_h3_cell = 1;
  repeated HexagonCellInfo cells = 2;
}
